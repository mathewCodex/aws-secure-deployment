upstream webstack_upstream {
	server unix:/run/gunicorn/webstack.sock;
}

server {
	listen 80 default_server;
	server_name _;
	access_log /var/log/nginx/webstack.access.log;
	error_log /var/log/nginx/webstack.error.log;

	location / {
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-forwarded-Proto $schema;
		proxy_http_version 1.1;
		proxy_pass http://webstack_upstream;
	}
}
